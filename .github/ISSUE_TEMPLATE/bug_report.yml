name: 转换问题
description: 报告模糊、公式乱码、排版变化或程序错误
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先搜索已有问题。请只提供脱敏的最小复现样例，不要上传完整私人报告。
  - type: input
    id: version
    attributes:
      label: 工具版本或发布包名称
      placeholder: 例如 v0.1.0，或下载文件名
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows 与 WPS / Word 版本
      placeholder: 例如 Windows 11；WPS 文字版本号
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 是否启用跨设备兼容模式
      options:
        - 已勾选
        - 未勾选
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现
      description: 输入格式、操作步骤、问题页码、查看 PDF 使用的设备或软件。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
      description: 可附脱敏截图，以及仅包含问题对象的最小文档。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的相关日志
      description: 复制转换日志中的相关部分，先移除私密文件名和路径。
      render: text
