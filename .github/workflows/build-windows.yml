name: Build Windows executable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm WordToPDF.spec
      - name: Package binary with corresponding source
        run: python scripts/package_release.py --exe dist/Word转PDF.exe --output release-assets/word-to-pdf-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: word-to-pdf-windows
          path: release-assets/word-to-pdf-windows.zip
